name: Build, test and package
on:
  push:
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
env:
  PHOSRACK_RELEASE_VERSION: 0.3.3
permissions:
  contents: read
jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - run: dnf install -y git gcc-c++ cmake ninja-build rpm-build qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg qt6-qtwebengine-devel qt6-qtwebchannel-devel kf6-kwallet-devel extra-cmake-modules pipewire-devel pkgconf-pkg-config
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHOSRACK_SPOTIFY_CLIENT_ID=
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: cd build && cpack -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-fedora-rpm
          path: build/phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-*.rpm
          if-no-files-found: error
  deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates build-essential cmake ninja-build qt6-base-dev qt6-declarative-dev libqt6svg6 qt6-svg-plugins qt6-webengine-dev qt6-webchannel-dev libkf6wallet-dev extra-cmake-modules dpkg-dev file pkg-config libpipewire-0.3-dev qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qttest
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHOSRACK_SPOTIFY_CLIENT_ID=
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: cd build && cpack -G DEB
      - uses: actions/upload-artifact@v4
        with:
          name: phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-debian-deb
          path: build/phosrack_${{ env.PHOSRACK_RELEASE_VERSION }}_amd64.deb
          if-no-files-found: error
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder appstream-compose
      - run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install runtime, SDK and WebEngine BaseApp
        timeout-minutes: 30
        run: flatpak install --user --noninteractive --no-related flathub org.kde.Platform//6.10 org.kde.Sdk//6.10 io.qt.qtwebengine.BaseApp//6.10
      - run: flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=repo flatpak-build packaging/flatpak/io.phosrack.Phosrack.json
      - run: flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-x86_64.flatpak io.phosrack.Phosrack
      - uses: actions/upload-artifact@v4
        with:
          name: phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-flatpak
          path: phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-x86_64.flatpak
          if-no-files-found: error
