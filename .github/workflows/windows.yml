name: Windows build and package
on:
  push:
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
env:
  PHOSRACK_RELEASE_VERSION: 0.3.2
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true
      - name: Report WebEngine codec support
        shell: pwsh
        run: |
          $qtRoot = Split-Path (Split-Path (Get-Command qmake.exe).Source -Parent) -Parent
          Get-ChildItem (Join-Path $qtRoot 'include/QtWebEngineCore') -Filter '*config*.h' -Recurse |
            Select-String -Pattern 'webengine_proprietary_codecs|webengine_system_ffmpeg'
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:/Program Files (x86)/NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHOSRACK_SPOTIFY_CLIENT_ID=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-win --parallel 2
          exit $LASTEXITCODE
      - name: Check WebEngine runtime capabilities
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          & .\build-win\phosrack-webengine-runtime-check.exe 2>&1 |
            Tee-Object -FilePath webengine-runtime-check.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-windows-runtime-check
          path: webengine-runtime-check.txt
          if-no-files-found: warn
      - name: Test
        shell: pwsh
        run: ctest --test-dir build-win --output-on-failure
      - name: Deploy, validate and package
        shell: pwsh
        run: ./packaging/windows/package.ps1 -BuildDirectory build-win -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-windows-x64
          path: |
            dist/phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-windows-x64.exe
            dist/phosrack-${{ env.PHOSRACK_RELEASE_VERSION }}-windows-x64.zip
          if-no-files-found: error
